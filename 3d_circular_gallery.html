<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>0xm4d</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            /* Solid off-white for better performance (No gradient overhead) */
            background: #f4f4f4;
            font-family: 'Inter', sans-serif;
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
        }

        /* 3D Scene Perspective */
        .gallery-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            /* Creates the 3D depth effect */
            perspective: 1200px;
            /* Smooth transition for mobile scaling */
            transition: transform 0.3s ease; 
        }

        /* Mobile View: Zoom out the entire 3D scene */
        @media (max-width: 768px) {
            .gallery-container {
                transform: scale(0.45);
            }
        }

        /* The Rotating Cylinder */
        .gallery-ring {
            position: relative;
            /* Dimensions of a single card to act as the anchor point */
            width: 130px;
            height: 190px;
            transform-style: preserve-3d;
            /* Tells the browser to optimize this element for animations */
            will-change: transform;
        }

        /* 3D Wrapper for each card (Handles positioning) */
        .card {
            position: absolute;
            inset: 0;
            transform-style: preserve-3d;
        }

        /* The actual visual card */
        .card-inner {
            width: 100%;
            height: 100%;
            position: relative;
            border-radius: 12px;
            overflow: hidden;
            background: #fff;
            /* Lightweight static shadow for maximum performance */
            border: 1px solid rgba(0, 0, 0, 0.05);
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
            -webkit-box-reflect: below 15px linear-gradient(transparent, transparent, rgba(0,0,0,0.15));
            cursor: pointer;
            /* Prevents rendering the back of the card to save memory */
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
        }

        .card-inner img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            pointer-events: none; /* Prevents dragging bugs */
        }

        /* Small UI accents */
        .ui-text {
            position: fixed;
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 1px;
            color: rgba(0, 0, 0, 0.7); /* Adjusted for light theme */
            text-transform: uppercase;
            pointer-events: none;
            z-index: 10;
        }
        .top-left { top: 30px; left: 40px; }
        .top-right { top: 30px; right: 40px; }
        .bottom-left { bottom: 30px; left: 40px; }

    </style>
</head>
<body>

    <div class="ui-text top-left">Muzakkir Mirza</div>
    <div class="ui-text top-right">Explore With 0xm4d</div>
    <div class="ui-text bottom-left"></div>

    <div class="gallery-container">
        <div class="gallery-ring" id="gallery-ring">
            <!-- JavaScript will dynamically inject the 3D cards here -->
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const galleryRing = document.getElementById('gallery-ring');
            
            // Adjust this number to add or remove cards from the circle
            const totalCards = 30; 

            // =========================================================================
            // 🛑 ADD YOUR OWN IMAGES HERE 🛑
            // Replace these placeholder URLs with your actual image links.
            // If you provide fewer images than 'totalCards', they will seamlessly repeat.
            // =========================================================================
            const userImages = [
                "a.jpg",
                "b.png",
                "c.jpg",
                "d.jpg",
                "e.jpg",
                "f.jpg",
                "g.webp",
                "h.jpeg",
                "i.jpg",
                "j.png",
                "k.jpg",
            
        
            ];
            // =========================================================================

            // Calculate the radius of the circle based on card width and total cards.
            // This math ensures the cards perfectly form a circle regardless of how many you add.
            const cardWidth = 130; 
            const radius = Math.round( (cardWidth / 2) / Math.tan( Math.PI / totalCards ) ) + 40; 

            // JS Animation State Variables
            let isPaused = false;
            let currentAngle = 0;
            const rotationSpeed = 0.15; // Animation speed

            // Hold-to-pause logic for both Mouse and Touch (Mobile)
            const pauseAnimation = () => { isPaused = true; };
            const resumeAnimation = () => { isPaused = false; };

            document.addEventListener('mousedown', pauseAnimation);
            document.addEventListener('mouseup', resumeAnimation);
            document.addEventListener('mouseleave', resumeAnimation); // In case mouse leaves window

            document.addEventListener('touchstart', pauseAnimation, { passive: true });
            document.addEventListener('touchend', resumeAnimation);
            document.addEventListener('touchcancel', resumeAnimation);

            // Generate the 3D gallery structure
            for (let i = 0; i < totalCards; i++) {
                
                // 1. The 3D Wrapper (Sets the angle and pushes it outwards to form the circle)
                const cardWrapper = document.createElement('div');
                cardWrapper.classList.add('card');
                
                const angle = (360 / totalCards) * i;
                cardWrapper.style.transform = `rotateY(${angle}deg) translateZ(${radius}px)`;

                // 2. The Inner Card (Handles the visible styling, image, and hover scale)
                const cardInner = document.createElement('div');
                cardInner.classList.add('card-inner');

                // Add Image from array
                const img = document.createElement('img');
                const imageSrc = userImages[i % userImages.length]; 
                img.src = imageSrc;
                img.alt = `Gallery Item ${i + 1}`;

                // Assemble DOM structure
                cardInner.appendChild(img);
                cardWrapper.appendChild(cardInner);
                galleryRing.appendChild(cardWrapper);
            }

            // Highly Optimized JavaScript Animation Loop for flawless performance
            function animate() {
                if (!isPaused) {
                    currentAngle -= rotationSpeed;
                    galleryRing.style.transform = `rotateY(${currentAngle}deg)`;
                }
                requestAnimationFrame(animate);
            }

            // Start the infinite smooth loop
            animate();
        });
    </script>
</body>
</html>
